<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DayFlow</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#03070C" id="tc">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#02050B;--p:#050B16;--p2:#07111F;--p3:#0A1728;--b:#1677E8;--b2:#7199D8;--t:#EEF3FC;--m:#71809A;--ok:#3BCFA7;--bad:#F05B76;--ln:rgba(91,139,210,.14)}
body.light{--bg:#EEF4FF;--p:#FFFFFF;--p2:#F3F6FF;--p3:#E5ECFF;--b:#287DFF;--b2:#5E7DFF;--t:#10182B;--m:#61708D;--ln:rgba(38,83,160,.13)}
body.fs-s{zoom:.92}body.fs-l{zoom:1.12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;background:radial-gradient(800px 500px at 72% -5%,rgba(22,92,190,.12),transparent 62%),radial-gradient(700px 500px at 18% 30%,rgba(45,45,150,.035),transparent 65%),var(--bg);color:var(--t);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;padding-bottom:84px}
body.light{background:linear-gradient(180deg,#F7FAFF,var(--bg))}
html.light,body.light{background:#F7FAFF}
button,input,textarea{font-family:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.app{max-width:900px;margin:auto;padding:0 14px}
.top{display:flex;position:relative;z-index:2;justify-content:space-between;align-items:center;padding:18px 0 10px;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.top h1{font-size:17px;margin:0;font-weight:900;display:flex;align-items:center;gap:9px;white-space:nowrap}
.top small{color:var(--m);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex:0 0 auto}
@media(max-width:520px){.top{gap:7px;padding-top:14px}.brand{gap:7px}.top h1{font-size:16px;gap:7px}.top small{display:none}.tr{gap:5px}.tr .chip{padding:6px 9px}.tr .chip.ic{padding:6px 9px}.tr #clk{font-size:11px;padding-inline:9px}}
.chip{background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--b2)}
.chip.ic{padding:6px 10px;font-size:16px;line-height:1.2}
.card{background:linear-gradient(145deg,var(--p2),var(--p));box-shadow:inset 0 1px 0 rgba(255,255,255,.025);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav h2{flex:1;margin:0;font-size:15px;font-weight:900;text-align:center}
.ib{width:38px;height:38px;border-radius:11px;background:var(--p);border:1px solid var(--ln);color:var(--b2);font-size:16px}
.btn{background:linear-gradient(135deg,#126ED8,#4B43C8);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}.btn.g{background:var(--p3);color:var(--t)}.btn.r{background:linear-gradient(135deg,#FF6680,#B8203E)}
.bar{height:7px;background:var(--p3);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#126ED8,#5146C7);transition:width .4s}
.hr{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;border-top:1px solid rgba(91,139,210,.10);min-height:58px;padding:8px 0;cursor:pointer;transition:.18s}.hr:first-child{border-top:0}.hr:hover{background:rgba(40,110,210,.035);border-radius:12px}.hr.now{background:linear-gradient(90deg,rgba(30,120,235,.10),transparent);border-radius:12px}.hl{width:auto;font-size:12px;color:#6F7F99;font-weight:800;padding-top:7px;flex:none;text-align:left;direction:ltr;letter-spacing:.2px}.hr.now .hl{color:#86B7FF}.hc{min-width:0;display:flex;flex-direction:column;gap:6px;min-height:42px}.hc:empty:after{content:'＋ افزودن برنامه';display:block;color:rgba(113,128,154,.48);font-size:10px;padding:7px 10px;border:1px dashed rgba(91,139,210,.10);border-radius:10px;opacity:0;transition:.18s}.hr:hover .hc:empty:after{opacity:1}
.tk{display:flex;align-items:center;gap:8px;border-radius:12px;padding:9px 11px;border-inline-start:4px solid var(--c);background:var(--p3);font-size:13px}
.tk.d .tt{text-decoration:line-through;opacity:.5}.tk .tt{flex:1;font-weight:700}.tk small{color:var(--m);font-size:10.5px;display:block;font-weight:400}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--c);flex:none;color:#fff;font-size:13px;line-height:1}.d .ck{background:var(--c)}
.x{color:var(--m);font-size:15px;padding:2px 6px}
textarea,input[type=text],input[type=time],input[type=number],input[type=search]{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;font-size:14px;outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.9}textarea:focus,input:focus{border-color:var(--b)}
input[type=range]{width:100%;accent-color:var(--b)}
.wk{display:grid;gap:10px}.wd{cursor:pointer}.wd.today{border-color:var(--b)}.wd h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.wd .tk{margin-bottom:5px}.mt{color:var(--m);font-size:12px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.mg .h{font-size:11px;color:var(--m);padding:4px 0;font-weight:700}
.mc{aspect-ratio:1;border-radius:12px;background:var(--p2);border:1px solid var(--ln);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mc.today{background:linear-gradient(135deg,#126ED8,#4B43C8);color:#fff}.mc.sel{outline:2px solid var(--b2)}.mc.off{opacity:.25;pointer-events:none}.mc.fri,.mc.holiday{color:var(--bad)}.mc.holiday{border-color:rgba(255,102,128,.55);background:rgba(255,102,128,.08)}.mc.today.holiday{background:linear-gradient(135deg,#126ED8,#4B43C8);color:#fff;border-color:#FF6680}.holidayTag{font-size:9px;color:var(--bad);font-weight:900}.wd.holiday{border-color:rgba(255,102,128,.55)}.wd.holiday h3{color:var(--bad)}
.dots{display:flex;gap:2px;height:5px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--ok)}.dots i.n{background:var(--b2)}.dots i.r{background:#FFB020}.dots i.h{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln)}.row:first-child{border:0}.row .i{flex:1;min-width:0}.row b{display:block;font-size:14px}.row small{color:var(--m);font-size:11px;line-height:1.7;display:block}
.row.done b{text-decoration:line-through;opacity:.5}.row.late small{color:var(--bad)}.row.tap{cursor:pointer}
.sw{width:46px;height:26px;border-radius:14px;background:var(--p3);position:relative;flex:none}.sw:after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--m);transition:.2s}.sw.on{background:var(--b)}.sw.on:after{right:23px;background:#fff}
.big{font-size:54px;font-weight:900;text-align:center;letter-spacing:1px;direction:ltr;background:linear-gradient(180deg,var(--t),var(--b2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.cen{text-align:center;color:var(--m);font-size:13px;margin-bottom:6px}
.sg{font-size:12.5px;color:var(--b2);font-weight:900;margin:20px 0 2px}
.hint{font-size:11.5px;color:var(--m);line-height:1.9;margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 6px}
.ch{background:var(--p3);border:1px solid var(--ln);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--m)}
.ch.on{background:rgba(23,139,255,.20);border-color:var(--b);color:var(--b2)}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(2,7,14,.96);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
body.light .tabbar{background:rgba(255,255,255,.94)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--m);font-size:10px;font-weight:700;position:relative}.tb span{font-size:18px}.tb.on{color:var(--b2);background:rgba(23,139,255,.12)}
.tb.routine-tab{margin:0;padding:7px 2px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--m);box-shadow:none}
.tb.routine-tab span{width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;background:var(--p3);border:1px solid var(--ln);color:var(--m)}
.tb.routine-tab em{font-style:normal;font-weight:700}
.tb.routine-tab.on{background:linear-gradient(145deg,rgba(23,139,255,.18),rgba(85,214,190,.10));border-color:rgba(23,139,255,.32);color:var(--b2);box-shadow:0 5px 16px rgba(0,90,180,.12)}
.tb.routine-tab.on span{background:linear-gradient(135deg,#126ED8,#4B43C8);border-color:transparent;color:#fff}
.tb:focus{outline:none}.tb:focus-visible{outline:2px solid rgba(90,153,249,.35);outline-offset:2px}
.bd{position:absolute;top:2px;left:50%;margin-left:6px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 4px}
@media(min-width:901px){body{padding:0 96px 24px 0}.tabbar{right:14px;left:auto;top:50%;bottom:auto;transform:translateY(-50%);width:72px;flex-direction:column;gap:6px;border:1px solid var(--ln);border-radius:20px}.wk{grid-template-columns:repeat(2,1fr)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}.ov.on{display:flex}
.sh{background:var(--p);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--ln);position:relative;overscroll-behavior:contain;touch-action:pan-y}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}.sheet-head h3{margin:0}.sheet-close{width:36px;height:36px;border-radius:11px;background:var(--p3);border:1px solid var(--ln);color:var(--m);font-size:20px;line-height:1;flex:none}.sheet-close:hover{color:var(--t);background:rgba(23,139,255,.12)}
.sh h3{margin:0 0 12px;font-size:15px}.sh label{display:block;font-size:11.5px;color:var(--m);margin:10px 0 5px;font-weight:700}.two{display:flex;gap:10px}.two>div{flex:1}
.cols{display:flex;gap:10px;margin:6px 0 14px}.cols i{width:30px;height:30px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid transparent}.cols i.on{border-color:var(--t)}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:linear-gradient(135deg,#126ED8,#4B43C8);color:#fff;padding:13px 20px;border-radius:16px;font-weight:800;font-size:13px;z-index:200;transition:.35s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(12,60,130,.28)}.toast.on{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--m);padding:26px 10px;font-size:13px}
.fab{position:fixed;bottom:92px;left:18px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#126ED8,#4B43C8);color:#fff;font-size:28px;box-shadow:0 10px 26px rgba(12,60,130,.28);z-index:19}
.routine-event{display:flex;align-items:center;gap:8px;padding:7px 9px;margin:3px 0;border-radius:10px;background:color-mix(in srgb,var(--rc) 12%,var(--p3));border:1px solid color-mix(in srgb,var(--rc) 42%,transparent);font-size:12px;cursor:pointer}.routine-event .recheck{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--rc);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-size:11px}.routine-event.done{opacity:.6}.routine-event.done .retitle{text-decoration:line-through}.routine-event .retitle{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis}.routine-event small{color:var(--m);margin-right:auto;white-space:nowrap}.routine-event .reedit{border:0;background:transparent;color:var(--m);padding:2px 4px;cursor:pointer}.routine-dot{background:#55D6BE!important}.rg{display:grid;gap:9px}.routine{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--ln);background:var(--p3);border-radius:14px;cursor:pointer}
.routine.done{opacity:.58}.routine.done .rtitle{text-decoration:line-through}.rcheck{width:28px;height:28px;border-radius:9px;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;flex:none}.routine.done .rcheck{background:var(--c)}
.rmain{flex:1;min-width:0}.rtitle{font-size:13px;font-weight:800}.rmeta{font-size:10.5px;color:var(--m);margin-top:3px}.rtime{font-size:11px;color:var(--b2);font-weight:800;direction:ltr}
.rprog{display:flex;align-items:center;gap:10px}.rprog .bar{flex:1;margin:0}.rscore{font-size:12px;font-weight:900;color:var(--b2);white-space:nowrap}
.rsection{margin-top:14px}.rsection:first-child{margin-top:0}.rday{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.rday b{font-size:13px}.rday span{font-size:11px;color:var(--m)}
.rempty{padding:22px 10px;text-align:center;color:var(--m);font-size:12.5px;line-height:1.9}

@media(min-width:901px){.fab{bottom:28px}}
.bn{background:rgba(23,139,255,.12);border:1px solid var(--b);border-radius:14px;padding:11px 14px;margin-bottom:10px;font-size:12.5px;font-weight:700;line-height:1.8;cursor:pointer}
.bn.warn{background:rgba(255,102,128,.14);border-color:var(--bad)}
.al{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(700px 500px at 50% 0,rgba(18,78,160,.12),transparent 65%),var(--bg);overflow:auto}
.al.on{display:flex}
.alc{width:100%;max-width:420px;text-align:center;margin:auto}
.ali{font-size:68px;line-height:1;animation:rg 1s ease-in-out infinite;display:inline-block}
@keyframes rg{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
.alk{margin-top:12px;font-size:12.5px;color:var(--b2);font-weight:800}
.alc h2{margin:6px 0 4px;font-size:24px;font-weight:900;line-height:1.5;word-break:break-word}
.alt{font-size:34px;font-weight:900;direction:ltr;color:var(--b2)}
.alc p{margin:4px 0;color:var(--m);font-size:13.5px;line-height:1.9}
.alr{font-size:12px;color:var(--bad);font-weight:700;margin:4px 0}
.alc .btn{width:100%;padding:15px;font-size:16px;margin-top:10px}
.snr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.snr .ch{padding:10px 14px;font-size:13px}.snr .ch.on{border-color:var(--b)}
.mute{margin-top:16px;color:var(--m);font-size:12.5px;font-weight:700;padding:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.today-actions{display:grid;grid-template-columns:1.35fr .8fr .8fr;gap:8px;margin-top:12px}.today-actions .btn{font-size:11.5px;padding:10px 6px}.free-tasks{margin-bottom:10px;padding:10px;border:1px dashed var(--ln);border-radius:14px;background:color-mix(in srgb,var(--b2) 5%,var(--p3))}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px}.section-title span{color:var(--m);font-size:10px}.free-toggle{display:flex;align-items:center;gap:8px;padding:10px 11px;margin-top:10px;border:1px solid var(--ln);border-radius:12px;background:var(--p3);cursor:pointer}.free-toggle input{accent-color:var(--b2)}@media(max-width:520px){.today-actions{grid-template-columns:1fr 1fr 1fr}}
</style>

<style id="df-user-app-icon">
.brand h1{display:flex;align-items:center;gap:9px}
.df-user-app-icon{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:0 0 34px;
box-shadow:0 4px 16px rgba(76,139,232,.22)}
@media(max-width:520px){.df-user-app-icon{width:31px;height:31px;flex-basis:31px;border-radius:8px}}
</style>

<style id="df-clean-icon">
.brand h1{display:flex;align-items:center;gap:9px}
.df-clean-icon{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:0 0 34px;
box-shadow:none;background:transparent}
@media(max-width:520px){.df-clean-icon{width:31px;height:31px;flex-basis:31px;border-radius:8px}}
</style>

<style id="df-motion">
:root{--ease:cubic-bezier(.22,.8,.24,1)}
@keyframes vIn{from{opacity:0;transform:translate(var(--dx,0),12px)}to{opacity:1;transform:none}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}@keyframes ovOut{from{opacity:1}to{opacity:0}}
@keyframes shUp{from{transform:translateY(46px);opacity:.4}to{transform:none;opacity:1}}@keyframes shDown{from{transform:none}to{transform:translateY(46px);opacity:.4}}
@keyframes alIn{from{opacity:0}to{opacity:1}}@keyframes alcIn{from{opacity:0;transform:scale(.93) translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.45)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes newIn{from{opacity:0;transform:translateY(-8px) scale(.97);background-color:color-mix(in srgb,var(--b) 32%,var(--p3))}to{opacity:1;transform:none}}
@keyframes barGrow{from{width:0}}
@keyframes tbPop{0%{transform:scale(.7) translateY(3px)}60%{transform:scale(1.2)}100%{transform:none}}
@keyframes bnIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#v.enter>*{animation:vIn .4s var(--ease) both}
#v.enter>:nth-child(2){animation-delay:.04s}#v.enter>:nth-child(3){animation-delay:.08s}#v.enter>:nth-child(4){animation-delay:.12s}#v.enter>:nth-child(5){animation-delay:.16s}#v.enter>:nth-child(n+6){animation-delay:.2s}
#v.enter .wk>.card{animation:vIn .42s var(--ease) both}#v.enter .wk>.card:nth-child(2){animation-delay:.05s}#v.enter .wk>.card:nth-child(3){animation-delay:.1s}#v.enter .wk>.card:nth-child(4){animation-delay:.15s}#v.enter .wk>.card:nth-child(5){animation-delay:.2s}#v.enter .wk>.card:nth-child(6){animation-delay:.25s}#v.enter .wk>.card:nth-child(7){animation-delay:.3s}
#v.enter .bar i{animation:barGrow .8s var(--ease) .15s both}
.ov.on{animation:ovIn .22s ease both}.ov.on .sh{animation:shUp .36s var(--ease) both}
.ov.on.out{animation:ovOut .19s ease both}.ov.on.out .sh{animation:shDown .19s ease-in both}
.al.on{animation:alIn .3s ease both}.al.on .alc{animation:alcIn .5s var(--ease) both}
.ck.pop,.rcheck.pop,.recheck.pop{animation:pop .38s var(--ease)}
.is-new{animation:newIn .55s var(--ease)}
.tb.on span{animation:tbPop .42s var(--ease)}
.bn{animation:bnIn .35s var(--ease)}
.btn,.ib,.chip,.ch,.tb,.mc,.fab,.x,.sw,.routine,.routine-event,.tk,.row.tap,.card.wd,.ck,.rcheck{transition:transform .17s var(--ease),background-color .22s,border-color .22s,color .22s,box-shadow .22s,opacity .22s,filter .2s}
.btn:active,.ib:active,.chip:active,.ch:active,.tb:active,.mc:active,.fab:active,.x:active{transform:scale(.93)}
.routine:active,.row.tap:active,.card.wd:active{transform:scale(.985)}
.btn.g.on{background:rgba(23,139,255,.2);color:var(--b2);box-shadow:inset 0 0 0 1px var(--b)}
.toast{transition:transform .5s cubic-bezier(.34,1.35,.5,1),opacity .3s}
.bar i{transition:width .6s var(--ease)}
body.theming,body.theming *{transition:background-color .4s ease,color .4s ease,border-color .4s ease!important}
@media(hover:hover){.btn:hover{filter:brightness(1.1)}.ib:hover,.chip:hover,.ch:hover,.mc:hover{border-color:var(--b)}.card.wd:hover,.routine:hover{border-color:rgba(23,139,255,.4)}}
@media(prefers-reduced-motion:reduce){#v.enter>*,.ov.on,.ov.on .sh,.al.on,.al.on .alc,.is-new,.tb.on span,.bn,.ck.pop,.rcheck.pop,.recheck.pop{animation:none!important}}
</style>

<style id="df-today">

async function cloudPush(now){
 if(!CU||!cDB)return;clearTimeout(cUpT);cUpT=0;
 const go=async()=>{cUpT=0;try{S.uid=CU.uid;if(!S.mt)S.mt=Date.now();const js=JSON.stringify(S);localStorage.setItem('planner_v1',js);await cRef().set({data:js,mt:S.mt});cMsg=''}catch(e){cMsg='⚠️ همگام‌سازی انجام نشد (اینترنت؟)'}};
 if(now)return go();cUpT=setTimeout(go,1500)
}
async function cloudStart(){
 if(!CU||!cDB||cBusy)return;cBusy=true;
 try{
  if(cUpT){await cloudPush(true)}
  const snap=await cRef().get();const cl=snap.exists?snap.data():null;
  if(!cl){await cloudPush(true)}
  else{
   const cd=JSON.parse(cl.data),lo=S,cm=cl.mt||0,lm=lo.mt||0;
   if((lo.uid&&lo.uid!==CU.uid)||!hasData(lo)){cBusy=false;return cloudApply(cd,cm)}
   if(!lo.uid&&!hasData(cd)){S.mt=Date.now();await cloudPush(true)}
   else if(!lo.uid){
    if(confirm('این حساب از قبل اطلاعات دارد.\n\nتأیید = اطلاعات حساب روی این گوشی بارگذاری شود (اطلاعات فعلی گوشی جایگزین می‌شود)\nانصراف = اطلاعات فعلی گوشی جایگزین اطلاعات حساب شود')){cBusy=false;return cloudApply(cd,cm)}
    S.mt=Date.now();await cloudPush(true)
   }else if(cm>lm){cBusy=false;return cloudApply(cd,cm)}
   else if(lm>cm){await cloudPush(true)}
   else{cMsg=''}
  }
 }catch(e){cMsg='⚠️ همگام‌سازی انجام نشد (اینترنت؟)'}
 cBusy=false;if(setOpen)openSet(1)
}
async function cloudSyncNow(){await cloudStart();toast(cMsg||'همگام شد ✅')}
function fbPlug(){
 var p=NP.FirebaseAuthentication;
 if(!p&&CAP){try{p=CAP.registerPlugin('FirebaseAuthentication')}catch(e){}}
 if(!p&&CAP&&CAP.Plugins)p=CAP.Plugins.FirebaseAuthentication;
 return p
}
async function gLogin(){
 if(!cAuth){toast('سرویس ورود بارگذاری نشد');return}
 try{
  if(NATIVE){
   const FA=fbPlug();
   if(!FA)throw new Error('پلاگین بومی ورود پیدا نشد. پلاگین‌های نصب‌شده: '+((CAP&&CAP.PluginHeaders)||[]).map(function(h){return h.name}).join(','));
   const r=await FA.signInWithGoogle({skipNativeAuth:true});
   const t=r&&r.credential&&r.credential.idToken;if(!t)throw new Error('no idToken');
   await cAuth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(t));
  }else{await cAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
 }catch(e){const m=String((e&&e.message)||e);if(!/cancel|closed|12501/i.test(m))toast('ورود ناموفق: '+m.slice(0,260),9000)}
}
async function gLogout(){
 if(!confirm('از حساب خارج می‌شوی؟\nاطلاعات در حساب گوگلت می‌ماند و از روی این گوشی پاک می‌شود.'))return;
 await cloudPush(true);
 if(cMsg&&!confirm('آخرین تغییرات هنوز به حساب ارسال نشده و با خروج از بین می‌رود. ادامه می‌دهی؟'))return;
 try{if(NATIVE){var FA=fbPlug();if(FA)await FA.signOut()}}catch(e){}
 try{await cAuth.signOut()}catch(e){}
 localStorage.removeItem('planner_v1');location.reload()
}
function acctHtml(){
 if(!cAuth)return `<div class="sg">حساب کاربری</div><div class="hint">⛔ سرویس ورود با گوگل بارگذاری نشده است. این نسخه باید با Workflow جدید (که فایل‌های Firebase را داخل www/vendor می‌گذارد) ساخته شود؛ اگر index.html را مستقیم یا با بیلد قدیمی باز کرده‌ای، این بخش کار نمی‌کند.</div>`;
 if(CU)return `<div class="sg">حساب کاربری</div><div class="row"><div class="i"><b>${esc(CU.displayName||'حساب گوگل')}</b><small dir="ltr" style="text-align:right">${esc(CU.email||'')}</small><small>${cMsg||'✅ اطلاعات به این حساب لینک است و همگام می‌شود'}</small></div></div><div class="two" style="gap:8px;margin-top:6px"><button class="btn g" style="font-size:12px;flex:1" onclick="cloudSyncNow()">🔄 همگام‌سازی</button><button class="btn r" style="font-size:12px;flex:1" onclick="gLogout()">خروج از حساب</button></div>`;
 return `<div class="sg">حساب کاربری</div><div class="hint">با ورود به حساب گوگل، اطلاعات به حساب تو لینک می‌شود و روی هر گوشی دیگر هم با همان حساب در دسترس است.</div><button class="btn" style="width:100%;margin-top:6px" onclick="gLogin()">ورود با گوگل</button>`}

window.addEventListener('online',()=>{if(CU)cloudStart()});

if(!NATIVE&&'serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').then(r=>swReg=r).catch(()=>{});navigator.serviceWorker.ready.then(r=>swReg=r).catch(()=>{})}
if(NATIVE){nRefreshPerm();nChannel().then(nSyncNow);nStatusBar();nHooks()}
